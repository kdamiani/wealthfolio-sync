# Mounted as /etc/nginx/conf.d/default.conf, see docker-compose.yml.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

limit_req_zone  $binary_remote_addr zone=sync:1m  rate=5r/s;
limit_req_zone  $binary_remote_addr zone=login:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sync_conn:1m;

server {
    listen 8080;
    listen [::]:8080;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_req_status  429;
    limit_conn_status 429;

    # Docker's DNS, asked per request through the variables below: with a fixed host name nginx
    # refuses to start while a container is down and keeps an old address after it is recreated.
    resolver 127.0.0.11 valid=30s;

    # /tmp is a tmpfs in the example, so a request body never reaches the disk.
    client_body_temp_path /tmp/client_temp;

    # Sets the session cookie, so it needs the same rewrite as `/`.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;

        proxy_cookie_path /api /;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $remote_addr;
        set $wealthfolio_upstream http://wealthfolio:8088;
        proxy_pass $wealthfolio_upstream;
    }

    # A statement stays in memory: bodies up to the buffer size never reach a temporary file, and
    # anything larger is refused with 413 before it is read. wealthfolio-sync itself allows 2 MiB.
    location ~ ^/sync(/|$) {
        limit_req  zone=sync burst=20 nodelay;
        limit_conn sync_conn 10;

        client_body_buffer_size 3m;
        client_max_body_size    3m;
        # An upload is imported within its request.
        proxy_read_timeout 310s;
        proxy_connect_timeout 5s;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $remote_addr;
        set $sync_upstream http://wealthfolio-sync:8090;
        proxy_pass $sync_upstream;
    }

    location / {
        # Wealthfolio sets `wf_session` with `Path=/api`. Widened to `/`, the browser also sends it
        # to /sync, which accepts only a valid Wealthfolio session.
        proxy_cookie_path /api /;

        # Events and streamed responses must pass without buffering.
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;

        client_max_body_size 100m;
        set $wealthfolio_upstream http://wealthfolio:8088;
        proxy_pass $wealthfolio_upstream;
    }
}
