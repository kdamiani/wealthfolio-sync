[project]
name = "wealthfolio-sync"
description = "Nightly read-only sync from brokers, exchanges and statements into a self-hosted Wealthfolio"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wfsync", "wfsync.sources"]

[tool.setuptools.dynamic]
version = { attr = "wfsync.__version__" }

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "C4", "S", "UP", "RET", "SIM", "PIE", "RUF"]
ignore = [
    "S310", # every URL is a constant https address or the configured Wealthfolio
    "RUF005", # plain concatenation reads fine for short tuples and lists
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S324", "RUF012", "B023"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["wfsync"]
