name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -t .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.3 mypy==2.4.1
      - run: ruff check .
      - run: mypy

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false

  contract:
    runs-on: ubuntu-latest
    env:
      WFSYNC_WEALTHFOLIO_URL: http://127.0.0.1:8088
      WFSYNC_ORIGIN: https://wealthfolio.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install --yes argon2
      - name: Start Wealthfolio with a throwaway database
        run: |
          image="$(sed -n 's/^ *image: \(wealthfolio\/wealthfolio:.*\)$/\1/p' examples/docker-compose.yml)"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "WF_PASSWORD=$password" >> "$GITHUB_ENV"
          WF_AUTH_PASSWORD_HASH="$(printf '%s' "$password" | argon2 "$(openssl rand -base64 16)" -id -e)"
          WF_SECRET_KEY="$(openssl rand -base64 32)"
          export WF_AUTH_PASSWORD_HASH WF_SECRET_KEY
          docker run --detach --name wealthfolio --publish 127.0.0.1:8088:8088 \
            --env WF_LISTEN_ADDR=0.0.0.0:8088 --env WF_DB_PATH=/data/wealthfolio.db \
            --env WF_DB_REQUIRE_ENCRYPTION=1 --env WF_SECRET_KEY --env WF_AUTH_PASSWORD_HASH \
            --env WF_CORS_ALLOW_ORIGINS="$WFSYNC_ORIGIN" "$image"
          curl --silent --show-error --fail --retry 30 --retry-delay 2 --retry-connrefused \
            --retry-all-errors --output /dev/null http://127.0.0.1:8088/api/v1/healthz
      - run: python -m tests.contract.wealthfolio_contract
      - if: failure()
        run: docker logs wealthfolio

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Only needed for repositories owned by an organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
